[package]
name = "pluguzu"
version = "0.1.0"
edition = "2024"

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "ed09eca4301f67f17d43474cd3d21ea10b639046", features = ["assert_process_allocs", "standalone"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "ed09eca4301f67f17d43474cd3d21ea10b639046" }
egui_code_editor = "0.2.17"
indexmap = "2.11.1"
dirs = "6.0.0"
serde_json = "1.0.145"
sndfile = "0.1.1"
samplerate = "0.2.4"
serde = "1.0.225"
smol_str = { version = "0.3.2", features = ["serde"]}
# dirt-sys = { path = "../dirt-sys" }
dirt-sys = { git = "https://codeberg.org/TristanCacqueray/dirt-sys.git", rev = "d5bc39268e92bced3f4fd51da1e4ec31c3e0067f" }

thiserror = "2"
rfd = "0.15.4"

[workspace]
members = ["xtask"]

[lib]
crate-type = ["cdylib", "lib"]

[features]
debug = []

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
