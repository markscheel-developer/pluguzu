[package]
name = "pluguzu"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
repository = "https://codeberg.org/TristanCacqueray/pluguzu"
authors = ["TristanCacqueray"]

[dependencies]
# The audio pluging framework
nih_plug = { git = "https://github.com/TristanCacqueray/nih-plug.git", rev = "48b278e3844beb44b981512ca8852ded69f136f5", features = ["assert_process_allocs", "standalone"] }
nih_plug_egui = { git = "https://codeberg.org/TristanCacqueray/egui-baseview", rev = "2233f9e46686ea073202e6dc351aa7612c83f3f8" }
# nih_plug = { path = "/srv/github.com/robbert-vdh/nih-plug/", features = ["assert_process_allocs", "standalone"] }
# nih_plug_egui = { path = "/srv/github.com/robbert-vdh/nih-plug/nih_plug_egui" }

# A str type to store sample names
smol_str = { version = "0.3.2", features = ["serde"]}
# Util for error management
thiserror = "2"
# Utils for key ordered hashmap, like for presets list.
indexmap = "2.11.1"
# Access to xdg config location
dirs = "6.0.0"
# Serialization for the FFI
serde = "1.0.225"
serde_json = "1.0.145"
# Audio samples utils
sndfile = { git = "https://github.com/TristanCacqueray/sndfile.rs", rev = "b201b9ab060cb20af39cb489627af95cfcb31c9e" }
samplerate = "0.2.4"
# The audio engine
dough-sys = { git = "https://codeberg.org/TristanCacqueray/dough-sys.git", rev = "796e1e637ca199223a9680d78304b831ac7453b3" }
# dough-sys = { path = "../dough-sys" }
# Helper to show file picker.
rfd = "0.15.4"
atomic_float = "1.1.0"
parking_lot = "0.12.4"
arc-swap = "1.7.1"
dashmap = "6.1.0"
time = "0.3.44"
urlencoding = "2"
lazy_static = "*"

[workspace]
members = ["xtask"]

[lib]
crate-type = ["cdylib", "lib"]

[features]
debug = []
debug-plugin = []

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
