[package]
name = "pluguzu"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
repository = "https://codeberg.org/TristanCacqueray/pluguzu"
authors = ["TristanCacqueray"]

[dependencies]
# The audio pluging framework
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "ed09eca4301f67f17d43474cd3d21ea10b639046", features = ["assert_process_allocs", "standalone"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "ed09eca4301f67f17d43474cd3d21ea10b639046" }
# An egui widget for the code editor
egui_code_editor = "0.2.17"
# A str type to store sample names
smol_str = { version = "0.3.2", features = ["serde"]}
# Util for error management
thiserror = "2"
# Utils for key ordered hashmap, like for presets list.
indexmap = "2.11.1"
# Access to xdg config location
dirs = "6.0.0"
# Serialization for the FFI
serde = "1.0.225"
serde_json = "1.0.145"
# Audio samples utils
sndfile = "0.1.1"
samplerate = "0.2.4"
# The audio engine
dirt-sys = { git = "https://codeberg.org/TristanCacqueray/dirt-sys.git", rev = "d5bc39268e92bced3f4fd51da1e4ec31c3e0067f" }
# dirt-sys = { path = "../dirt-sys" }
# Helper to show file picker.
rfd = "0.15.4"
atomic_float = "1.1.0"
parking_lot = "0.12.4"

[workspace]
members = ["xtask"]

[lib]
crate-type = ["cdylib", "lib"]

[features]
debug = []

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
